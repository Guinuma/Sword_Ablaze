name: Validate combat
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1 Standard
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Import, test and start the game
        run: python3 tools/validate.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
